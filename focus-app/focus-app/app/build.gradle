plugins {
    id 'com.android.application'
}

android {
    namespace 'com.focus.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.focus.app"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        focus {
            storeFile file('focus.jks')
            storePassword 'focusapp'
            keyAlias 'focus'
            keyPassword 'focusapp'
        }
    }

    buildTypes {
        debug {
            if (file('focus.jks').exists()) {
                signingConfig signingConfigs.focus
            }
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}
