name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: focus-app/focus-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Signing key cache
        uses: actions/cache@v4
        with:
          path: focus-app/focus-app/app/focus.jks
          key: focus-signing-key-v1

      - name: Create signing key if missing
        run: |
          if [ ! -f app/focus.jks ]; then
            keytool -genkeypair -keystore app/focus.jks -storepass focusapp -keypass focusapp \
              -alias focus -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Focus App"
          fi

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/focus-app.apk

      - uses: actions/upload-artifact@v4
        with:
          name: focus-app-apk
          path: focus-app.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Focus build ${{ github.run_number }}
          files: focus-app.apk
